<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Mansi Patil — Cloud-Native AI / MLOps Engineer</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b0638b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="300" fill="#1c0f16"/>

  <!-- subtle grid dots -->
  <g fill="#2e1c26">
    <circle cx="40" cy="40" r="1.4"/><circle cx="80" cy="40" r="1.4"/><circle cx="120" cy="40" r="1.4"/>
    <circle cx="40" cy="80" r="1.4"/><circle cx="80" cy="80" r="1.4"/><circle cx="120" cy="80" r="1.4"/>
    <circle cx="40" cy="120" r="1.4"/><circle cx="80" cy="120" r="1.4"/><circle cx="120" cy="120" r="1.4"/>
    <circle cx="1080" cy="220" r="1.4"/><circle cx="1120" cy="220" r="1.4"/><circle cx="1160" cy="220" r="1.4"/>
    <circle cx="1080" cy="260" r="1.4"/><circle cx="1120" cy="260" r="1.4"/><circle cx="1160" cy="260" r="1.4"/>
  </g>

  <!-- Name + title -->
  <text x="60" y="108" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f0f4f8" letter-spacing="1">Mansi Patil</text>
  <text x="60" y="146" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#e79bc0">Cloud &amp; AI Engineer | Software Developer</text>
  <text x="60" y="172" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9a3b3">AWS infrastructure · Machine learning · Full-stack development</text>

  <!-- divider -->
  <line x1="60" y1="196" x2="620" y2="196" stroke="#1f2937" stroke-width="1"/>

  <!-- pill badges -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
    <rect x="60" y="216" width="86" height="30" rx="15" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="103" y="235" fill="#e79bc0" text-anchor="middle">AWS</text>

    <rect x="158" y="216" width="112" height="30" rx="15" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="214" y="235" fill="#e79bc0" text-anchor="middle">Serverless</text>

    <rect x="282" y="216" width="96" height="30" rx="15" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="330" y="235" fill="#e79bc0" text-anchor="middle">MLOps</text>

    <rect x="390" y="216" width="106" height="30" rx="15" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="443" y="235" fill="#e79bc0" text-anchor="middle">Python</text>

    <rect x="508" y="216" width="98" height="30" rx="15" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="557" y="235" fill="#e79bc0" text-anchor="middle">Docker</text>
  </g>

  <!-- right side: simple architecture flow -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    <!-- nodes -->
    <rect x="700" y="70" width="110" height="46" rx="6" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="755" y="98" fill="#f2d9e4" text-anchor="middle">Model</text>

    <rect x="860" y="70" width="110" height="46" rx="6" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="915" y="98" fill="#f2d9e4" text-anchor="middle">Pipeline</text>

    <rect x="1020" y="70" width="120" height="46" rx="6" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="1080" y="98" fill="#f2d9e4" text-anchor="middle">Monitoring</text>

    <rect x="860" y="170" width="110" height="46" rx="6" fill="#241722" stroke="#8a4a68" stroke-width="1"/>
    <text x="915" y="198" fill="#f2d9e4" text-anchor="middle">Alerts</text>

    <!-- arrows -->
    <line x1="810" y1="93" x2="856" y2="93" stroke="#b0638b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="970" y1="93" x2="1016" y2="93" stroke="#b0638b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="915" y1="116" x2="915" y2="166" stroke="#b0638b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <text x="700" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a8798f">Systems designed to hold up in production</text>
